<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#123a34" />
  <title>منصة مسار الاستراتيجية والأداء</title>
  <style>
:root{
  --bg:#f4f7f6;
  --surface:#ffffff;
  --surface-2:#edf3f1;
  --ink:#172321;
  --muted:#667672;
  --line:#dce6e3;
  --primary:#123a34;
  --primary-2:#1e5a50;
  --accent:#c89b46;
  --danger:#a83a3a;
  --warning:#b66a15;
  --success:#2f7d5f;
  --shadow:0 18px 50px rgba(18,58,52,.10);
  --radius:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Tahoma","Arial",sans-serif;
  line-height:1.7;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app-shell{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
.sidebar{
  background:linear-gradient(180deg,#123a34,#0d2d28);
  color:#fff;
  padding:22px 18px;
  position:sticky;top:0;height:100vh;overflow:auto;z-index:20;
}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand-mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#e0be77);color:#17352f;display:grid;place-items:center;font-weight:900;font-size:24px}
.brand h1{margin:0;font-size:22px}.brand p{margin:0;color:#cfe0dc;font-size:12px}
.plan-switcher{padding:18px 8px 8px}.plan-switcher label{font-size:12px;color:#cfe0dc}
.plan-switcher select{width:100%;margin-top:6px;background:#fff;color:#17352f;border:none;border-radius:12px;padding:10px}
.switch-actions{display:flex;gap:8px;margin-top:8px}
.mini-btn,.footer-btn{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.10);color:#fff;border-radius:10px;padding:8px 10px;flex:1}
.mini-btn.ghost,.footer-btn.ghost{background:transparent}
.progress-card{margin:12px 8px;background:rgba(255,255,255,.09);padding:14px;border-radius:14px}
.progress-head{display:flex;justify-content:space-between}.progress-track{height:7px;background:rgba(255,255,255,.14);border-radius:99px;margin:10px 0;overflow:hidden}
.progress-track span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#f0d39b);border-radius:99px}
.progress-card small{color:#cfe0dc}
.stage-nav{padding:8px}
.stage-group-title{font-size:11px;color:#9fc0b8;padding:14px 10px 5px}
.stage-item{
  width:100%;border:none;background:transparent;color:#dcece8;border-radius:12px;padding:10px 12px;
  display:flex;align-items:center;gap:10px;text-align:right;margin:2px 0
}
.stage-item:hover,.stage-item.active{background:rgba(255,255,255,.12);color:#fff}
.stage-item .num{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.10);display:grid;place-items:center;font-size:12px}
.stage-item.done .num{background:var(--accent);color:#14352f}
.stage-item small{margin-right:auto;color:#9fc0b8}
.sidebar-footer{padding:10px 8px;display:grid;gap:8px}
.file-label{text-align:center;display:block}
.main{min-width:0}
.topbar{
  position:sticky;top:0;z-index:10;background:rgba(244,247,246,.92);backdrop-filter:blur(14px);
  padding:18px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between
}
.eyebrow{font-size:12px;color:var(--primary-2);font-weight:700}.topbar h2{margin:0;font-size:24px}
.top-actions{display:flex;align-items:center;gap:10px}.save-state{font-size:12px;color:var(--success)}
.btn{border:none;border-radius:12px;padding:10px 15px;font-weight:700}
.btn.primary{background:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-2)}
.btn.ghost{background:var(--surface);color:var(--primary);border:1px solid var(--line)}
.btn.danger{background:#fff1f1;color:var(--danger);border:1px solid #f0caca}
.icon-btn{border:none;background:transparent;font-size:22px;color:inherit}
.content{padding:28px;max-width:1500px;margin:auto}
.hero{
  background:linear-gradient(135deg,#123a34,#1b5a50);
  color:#fff;border-radius:26px;padding:28px;box-shadow:var(--shadow);display:grid;grid-template-columns:1.5fr .7fr;gap:24px
}
.hero h3{font-size:30px;margin:6px 0}.hero p{color:#d5e5e1;max-width:800px}.hero-stat{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat-box{background:rgba(255,255,255,.10);padding:16px;border-radius:16px}.stat-box strong{display:block;font-size:26px}
.grid{display:grid;gap:18px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 8px 30px rgba(18,58,52,.05)}
.card h3,.card h4{margin-top:0}.card-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.section-title{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px}
.section-title h3{font-size:26px;margin:0}.section-title p{margin:4px 0 0;color:var(--muted)}
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:20px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}.kpi small{color:var(--muted)}.kpi strong{display:block;font-size:28px;margin-top:5px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700}
.input,textarea,select.input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;color:var(--ink)}
textarea.input{min-height:110px;resize:vertical}
.input:focus{outline:3px solid rgba(30,90,80,.12);border-color:var(--primary-2)}
.hint{font-size:12px;color:var(--muted)}
.stage-actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.callout{background:#f3f8f6;border-right:4px solid var(--primary-2);padding:14px 16px;border-radius:12px;color:#35504a}
.callout.warning{background:#fff8ef;border-right-color:var(--warning)}
.callout.success{background:#eff9f4;border-right-color:var(--success)}
.score-wrap{display:flex;align-items:center;gap:16px}.score-ring{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--success) var(--score),#e4ece9 0);position:relative}
.score-ring:after{content:"";position:absolute;inset:9px;background:#fff;border-radius:50%}.score-ring strong{position:relative;z-index:1;font-size:20px}
.rubric-list{display:grid;gap:8px}.rubric-item{display:grid;grid-template-columns:150px 1fr 42px;gap:10px;align-items:center;font-size:13px}
.rubric-bar{height:7px;background:#edf1f0;border-radius:99px;overflow:hidden}.rubric-bar span{display:block;height:100%;background:var(--primary-2)}
.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;min-width:760px}.data-table th,.data-table td{border-bottom:1px solid var(--line);padding:10px;text-align:right;vertical-align:top}.data-table th{background:#f7faf9;font-size:12px;color:#52645f;position:sticky;top:0}
.badge{display:inline-flex;align-items:center;border-radius:99px;padding:4px 9px;font-size:11px;font-weight:700;background:#edf3f1;color:var(--primary)}
.badge.success{background:#e7f5ee;color:var(--success)}.badge.warning{background:#fff3df;color:var(--warning)}.badge.danger{background:#fdeaea;color:var(--danger)}
.list-stack{display:grid;gap:10px}.list-item{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;display:flex;gap:12px;align-items:flex-start}
.list-item .grow{flex:1}.list-item h4{margin:0}.list-item p{margin:4px 0 0;color:var(--muted)}
.inline-actions{display:flex;gap:7px;flex-wrap:wrap}
.pill-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.pill-tab{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px}.pill-tab.active{background:var(--primary);color:#fff}
.empty{padding:34px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
.toast{position:fixed;left:24px;bottom:24px;background:#152f2a;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);opacity:0;transform:translateY(16px);pointer-events:none;transition:.25s;z-index:100}
.toast.show{opacity:1;transform:none}
dialog{border:none;padding:0;background:transparent}.modal-card{width:min(760px,92vw);background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:0;overflow:hidden}.modal-head,.modal-actions{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.modal-actions{border-top:1px solid var(--line);border-bottom:none;justify-content:flex-end}.modal-head h3{margin:0}#modalBody{padding:20px;max-height:65vh;overflow:auto}
.mobile-only{display:none}
.report-section{page-break-inside:avoid;margin-bottom:18px}
@media(max-width:1050px){
  .app-shell{grid-template-columns:1fr}.sidebar{position:fixed;right:0;transform:translateX(105%);transition:.25s;width:300px}.sidebar.open{transform:none}
  .mobile-only{display:inline-block}.hero{grid-template-columns:1fr}.kpi-grid{grid-template-columns:repeat(2,1fr)}.grid.three{grid-template-columns:1fr 1fr}
}
@media(max-width:720px){
  .content{padding:16px}.topbar{padding:14px 16px}.top-actions .save-state,.top-actions .ghost{display:none}
  .grid.two,.grid.three,.form-grid,.kpi-grid{grid-template-columns:1fr}.hero-stat{grid-template-columns:1fr 1fr}
  .section-title{display:block}.stage-actions{flex-direction:column}
}
@media print{
  .sidebar,.topbar,.no-print,.toast{display:none!important}.app-shell{display:block}.content{padding:0;max-width:none}
  body{background:#fff}.card{box-shadow:none;break-inside:avoid}.hero{box-shadow:none}
}

</style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">م</div>
        <div>
          <h1>مسار</h1>
          <p>الاستراتيجية والأداء المؤسسي</p>
        </div>
      </div>

      <div class="plan-switcher">
        <label>الخطة الحالية</label>
        <select id="planSelect"></select>
        <div class="switch-actions">
          <button class="mini-btn" id="newPlanBtn">خطة جديدة</button>
          <button class="mini-btn ghost" id="duplicatePlanBtn">نسخ</button>
        </div>
      </div>

      <div class="progress-card">
        <div class="progress-head">
          <span>اكتمال الخطة</span>
          <strong id="overallProgressText">0%</strong>
        </div>
        <div class="progress-track"><span id="overallProgressBar"></span></div>
        <small id="progressHint">ابدأ بتهيئة المنظمة</small>
      </div>

      <nav id="stageNav" class="stage-nav"></nav>

      <div class="sidebar-footer">
        <button id="exportJsonBtn" class="footer-btn">تصدير نسخة احتياطية</button>
        <label class="footer-btn file-label">
          استيراد نسخة
          <input id="importJsonInput" type="file" accept=".json" hidden />
        </label>
        <button id="printBtn" class="footer-btn ghost">طباعة التقرير</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <button class="icon-btn mobile-only" id="menuBtn">☰</button>
          <span class="eyebrow">من التشخيص إلى الأثر</span>
          <h2 id="pageTitle">لوحة التحكم</h2>
        </div>
        <div class="top-actions">
          <span class="save-state" id="saveState">تم الحفظ</span>
          <button class="btn ghost" id="reviewPlanBtn">فحص الاتساق</button>
          <button class="btn primary" id="generateReportBtn">توليد التقرير</button>
        </div>
      </header>

      <section id="content" class="content"></section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <dialog id="modal">
    <form method="dialog" class="modal-card">
      <div class="modal-head">
        <h3 id="modalTitle">عنوان</h3>
        <button value="cancel" class="icon-btn">×</button>
      </div>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button value="cancel" class="btn ghost">إغلاق</button>
        <button id="modalConfirmBtn" value="default" class="btn primary">اعتماد</button>
      </div>
    </form>
  </dialog>

  <script>
const STORAGE_KEY = "masar_strategy_platform_v1";

const stages = [
  {id:"dashboard", group:"الرئيسية", title:"لوحة التحكم", icon:"◈"},
  {id:"organization", group:"بناء الاستراتيجية", title:"تهيئة المنظمة", icon:"1"},
  {id:"diagnosis", group:"بناء الاستراتيجية", title:"التشخيص المؤسسي", icon:"2"},
  {id:"environment", group:"بناء الاستراتيجية", title:"التحليل الاستراتيجي", icon:"3"},
  {id:"stakeholders", group:"بناء الاستراتيجية", title:"أصحاب المصلحة", icon:"4"},
  {id:"theory", group:"بناء الاستراتيجية", title:"نظرية التغيير", icon:"5"},
  {id:"identity", group:"بناء الاستراتيجية", title:"الهوية الاستراتيجية", icon:"6"},
  {id:"issues", group:"بناء الاستراتيجية", title:"القضايا والأولويات", icon:"7"},
  {id:"dimensions", group:"بناء الاستراتيجية", title:"الأبعاد الاستراتيجية", icon:"8"},
  {id:"objectives", group:"بناء الاستراتيجية", title:"الأهداف الاستراتيجية", icon:"9"},
  {id:"map", group:"بناء الاستراتيجية", title:"الخريطة الاستراتيجية", icon:"10"},
  {id:"indicators", group:"إدارة الأداء", title:"المؤشرات الاستراتيجية", icon:"11"},
  {id:"initiatives", group:"إدارة الأداء", title:"المبادرات والبرامج", icon:"12"},
  {id:"operations", group:"إدارة الأداء", title:"الخطة التشغيلية", icon:"13"},
  {id:"performance", group:"إدارة الأداء", title:"متابعة الأداء", icon:"14"},
  {id:"governance", group:"إدارة الأداء", title:"حوكمة الأداء", icon:"15"},
  {id:"report", group:"المخرجات", title:"التقرير الاستراتيجي", icon:"16"}
];

const diagnosisAxes = [
  "الهوية والتوجه","الحوكمة والامتثال","القيادة والإدارة","الموارد البشرية",
  "الاستدامة المالية","البرامج والخدمات","التقنية والبيانات","الشراكات والاتصال","التعلم والابتكار"
];

function uid(){ return Math.random().toString(36).slice(2,10); }
function escapeHtml(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));}
function clamp(n,min=0,max=100){return Math.max(min,Math.min(max,n));}

function newPlan(name="الخطة الاستراتيجية 2027–2030"){
  return {
    id:uid(), name, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(),
    organization:{name:"",type:"جمعية أهلية",sector:"",region:"",beneficiaries:"",employees:"",volunteers:"",budget:"",startYear:"2027",endYear:"2030",team:""},
    diagnosis:Object.fromEntries(diagnosisAxes.map(a=>[a,{score:0,evidence:"",gaps:""}])),
    environment:{strengths:[],weaknesses:[],opportunities:[],threats:[],pestel:{political:"",economic:"",social:"",technological:"",environmental:"",legal:""}},
    stakeholders:[],
    theory:{problem:"",rootCauses:"",targetGroup:"",inputs:"",activities:"",outputs:"",shortOutcomes:"",midOutcomes:"",impact:"",assumptions:"",risks:""},
    identity:{purpose:"",vision:"",mission:"",values:[]},
    issues:[],
    dimensions:[],
    objectives:[],
    mapLinks:[],
    indicators:[],
    initiatives:[],
    operations:[],
    performanceUpdates:[],
    governance:{boardRole:"",executiveRole:"",strategyOfficeRole:"",reviewCycle:"ربع سنوي",approvalFlow:"",raci:[]},
    approvals:{},
    notes:{}
  };
}

let state = loadState();
let currentPlanId = state.currentPlanId || state.plans[0].id;
let currentStage = "dashboard";

function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){const s=JSON.parse(raw); if(s.plans?.length) return s;}
  }catch(e){}
  const p=newPlan();
  return {currentPlanId:p.id,plans:[p]};
}
function saveState(){
  state.currentPlanId=currentPlanId;
  const p=getPlan(); p.updatedAt=new Date().toISOString();
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  const el=document.getElementById("saveState");
  if(el){el.textContent="تم الحفظ الآن"; setTimeout(()=>el.textContent="تم الحفظ",900);}
}
function getPlan(){return state.plans.find(p=>p.id===currentPlanId) || state.plans[0];}

function showToast(msg){
  const t=document.getElementById("toast"); t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);
}
function openModal(title,body,onConfirm=null){
  const d=document.getElementById("modal");
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalBody").innerHTML=body;
  const btn=document.getElementById("modalConfirmBtn");
  btn.style.display=onConfirm?"inline-flex":"none";
  btn.onclick=(e)=>{e.preventDefault(); if(onConfirm) onConfirm(); d.close();};
  d.showModal();
}

function calculateProgress(plan){
  const checks = [
    !!plan.organization.name, !!plan.organization.sector,
    Object.values(plan.diagnosis).filter(x=>x.score>0).length>=5,
    plan.environment.strengths.length>=2 && plan.environment.weaknesses.length>=2,
    plan.stakeholders.length>=3,
    !!plan.theory.problem && !!plan.theory.impact,
    !!plan.identity.purpose && !!plan.identity.vision && !!plan.identity.mission && plan.identity.values.length>=3,
    plan.issues.length>=3, plan.dimensions.length>=3, plan.objectives.length>=3,
    plan.mapLinks.length>=2, plan.indicators.length>=3, plan.initiatives.length>=2,
    plan.operations.length>=3, plan.performanceUpdates.length>=1,
    !!plan.governance.boardRole
  ];
  return Math.round(checks.filter(Boolean).length/checks.length*100);
}

function renderShell(){
  renderPlanSelect();
  renderNav();
  const p=getPlan(), progress=calculateProgress(p);
  document.getElementById("overallProgressText").textContent=progress+"%";
  document.getElementById("overallProgressBar").style.width=progress+"%";
  document.getElementById("progressHint").textContent=progress<30?"استكمل التهيئة والتشخيص":progress<70?"انتقل لبناء الخيارات والأهداف":"اقتربت الخطة من الاكتمال";
  const stage=stages.find(s=>s.id===currentStage);
  document.getElementById("pageTitle").textContent=stage?.title||"";
}

function renderPlanSelect(){
  const sel=document.getElementById("planSelect");
  sel.innerHTML=state.plans.map(p=>`<option value="${p.id}" ${p.id===currentPlanId?"selected":""}>${escapeHtml(p.name)}</option>`).join("");
}

function isStageDone(id,p){
  const map={
    organization:!!p.organization.name&&!!p.organization.sector,
    diagnosis:Object.values(p.diagnosis).filter(x=>x.score>0).length>=5,
    environment:p.environment.strengths.length>=2&&p.environment.weaknesses.length>=2,
    stakeholders:p.stakeholders.length>=3,
    theory:!!p.theory.problem&&!!p.theory.impact,
    identity:!!p.identity.vision&&!!p.identity.mission&&p.identity.values.length>=3,
    issues:p.issues.length>=3,dimensions:p.dimensions.length>=3,objectives:p.objectives.length>=3,
    map:p.mapLinks.length>=2,indicators:p.indicators.length>=3,initiatives:p.initiatives.length>=2,
    operations:p.operations.length>=3,performance:p.performanceUpdates.length>=1,
    governance:!!p.governance.boardRole,report:calculateProgress(p)>=70
  };
  return !!map[id];
}

function renderNav(){
  const p=getPlan(), nav=document.getElementById("stageNav");
  let currentGroup="";
  nav.innerHTML=stages.map(s=>{
    let heading="";
    if(s.group!==currentGroup){currentGroup=s.group;heading=`<div class="stage-group-title">${s.group}</div>`;}
    return heading+`<button class="stage-item ${currentStage===s.id?"active":""} ${isStageDone(s.id,p)?"done":""}" data-stage="${s.id}">
      <span class="num">${s.icon}</span><span>${s.title}</span>${isStageDone(s.id,p)?'<small>مكتمل</small>':""}
    </button>`;
  }).join("");
  nav.querySelectorAll("[data-stage]").forEach(b=>b.onclick=()=>{currentStage=b.dataset.stage;render();document.getElementById("sidebar").classList.remove("open");});
}

function render(){
  renderShell();
  const fn=views[currentStage]||views.dashboard;
  document.getElementById("content").innerHTML=fn(getPlan());
  bindCommon();
}

function bindCommon(){
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{currentStage=b.dataset.go;render();});
  document.querySelectorAll("[data-field]").forEach(el=>{
    el.addEventListener("input",()=>{
      const path=el.dataset.field.split(".");
      let obj=getPlan(); while(path.length>1)obj=obj[path.shift()];
      obj[path[0]]=el.type==="number"?Number(el.value):el.value;
      saveState(); renderShell();
    });
  });
}

function scoreText(text,type){
  const t=(text||"").trim();
  const words=t.split(/\s+/).filter(Boolean).length;
  const rubrics={
    vision:[
      ["مستقبلية",/(مجتمع|بيئة|ريادة|مستقبل|نحو|أن نكون)/,20],
      ["موجزة",words>2&&words<=18,20],
      ["ملهمة",/(مستدام|مزدهر|رائد|مُمكّن|جودة|أثر)/,20],
      ["غير تشغيلية",!/(تنفيذ|تقديم|تدريب|توزيع|إدارة)/.test(t),20],
      ["واضحة",t.length>=15,20]
    ],
    mission:[
      ["تحدد المستفيد",/(أسر|أيتام|شباب|مستفيد|مجتمع|نساء|أطفال|منظمات)/,20],
      ["تحدد القيمة",/(تمكين|رعاية|تنمية|تطوير|تحسين|تعزيز|خدمة)/,20],
      ["توضح الأسلوب",/(من خلال|عبر|بواسطة|بالشراكة)/,20],
      ["تتجه للأثر",/(أثر|استدام|جودة حياة|نتائج|تغيير)/,20],
      ["متوازنة الطول",words>=8&&words<=35,20]
    ],
    objective:[
      ["يركز على نتيجة",/(رفع|خفض|تحسين|تعزيز|زيادة|تنمية|تحقيق|تمكين)/,20],
      ["قابل للقياس",/\d|نسبة|معدل|مؤشر|مستوى/,20],
      ["محدد زمنيا",/(خلال|بحلول|سنة|سنوات|20\d\d)/,20],
      ["واضح",words>=5&&words<=30,20],
      ["غير تشغيلي",!/(عقد|تنفيذ دورة|إعداد تقرير|إنشاء اجتماع)/.test(t),20]
    ]
  };
  const rows=rubrics[type]||[];
  let score=0; const details=[];
  rows.forEach(([name,test,pts])=>{const ok=test instanceof RegExp?test.test(t):!!test;score+=ok?pts:0;details.push({name,score:ok?pts:0,max:pts});});
  return {score,details};
}

function suggestIdentity(kind,p){
  const sector=p.organization.sector||"التنمية المجتمعية";
  const ben=p.organization.beneficiaries||"الفئات المستفيدة";
  if(kind==="vision") return [
    `مجتمعٌ مُمكّن تتحقق فيه جودة الحياة المستدامة لـ${ben}.`,
    `الريادة في صناعة أثر تنموي مستدام في مجال ${sector}.`,
    `بيئة مجتمعية مزدهرة تتسع فيها فرص التمكين والاعتماد على الذات.`
  ];
  if(kind==="mission") return [
    `نُمكّن ${ben} من خلال برامج نوعية وشراكات فاعلة وحلول مستدامة تحقق أثرًا قابلًا للقياس.`,
    `نعمل على تطوير وتقديم تدخلات متكاملة في مجال ${sector} تستجيب للاحتياج وتبني قدرات المستفيدين.`,
    `نصنع قيمة اجتماعية مستدامة عبر خدمات عالية الجودة، وبيانات موثوقة، وشراكات مؤثرة.`
  ];
  return [
    `الإسهام في إحداث تغيير مستدام في حياة ${ben}.`,
    `تعظيم القيمة الاجتماعية المتحققة في مجال ${sector}.`,
    `تمكين الإنسان والمجتمع من بناء مستقبل أكثر استدامة.`
  ];
}

function arrayEditor(title,key,items,placeholder){
  return `<div class="card">
    <div class="card-header"><h3>${title}</h3><button class="btn ghost add-array" data-key="${key}" data-placeholder="${placeholder}">إضافة</button></div>
    <div class="list-stack">${items.length?items.map((x,i)=>`<div class="list-item"><div class="grow">${escapeHtml(x)}</div><button class="icon-btn remove-array" data-key="${key}" data-index="${i}">×</button></div>`).join(""):'<div class="empty">لا توجد عناصر بعد</div>'}</div>
  </div>`;
}

function bindArrayEditors(){
  document.querySelectorAll(".add-array").forEach(b=>b.onclick=()=>{
    const key=b.dataset.key, placeholder=b.dataset.placeholder;
    openModal("إضافة عنصر",`<div class="field"><label>${placeholder}</label><textarea id="arrayValue" class="input"></textarea></div>`,()=>{
      const val=document.getElementById("arrayValue").value.trim(); if(!val)return;
      const p=getPlan(); const path=key.split("."); let obj=p; while(path.length>1)obj=obj[path.shift()];
      obj[path[0]].push(val);saveState();render();
    });
  });
  document.querySelectorAll(".remove-array").forEach(b=>b.onclick=()=>{
    const path=b.dataset.key.split(".");let obj=getPlan();while(path.length>1)obj=obj[path.shift()];
    obj[path[0]].splice(Number(b.dataset.index),1);saveState();render();
  });
}

</tbody></table></div><div class="stage-actions"><button class="btn ghost" data-go="map">السابق</button><button class="btn primary" data-go="initiatives">التالي: المبادرات</button></div>`,
initiatives:p=>`<div class="section-title"><div><h3>المبادرات والبرامج</h3><p>تحويل الأهداف إلى تدخلات استراتيجية ونتائج ومشروعات قابلة للإدارة.</p></div><button class="btn primary" id="addInitiativeBtn">إضافة مبادرة</button></div>
<div class="grid two">${p.initiatives.map((x,i)=>`<div class="card"><div class="card-header"><span class="badge">${escapeHtml(x.status)}</span><button class="icon-btn delete-item" data-type="initiatives" data-index="${i}">×</button></div><h3>${escapeHtml(x.name)}</h3><p>${escapeHtml(x.description)}</p><small>الهدف: ${escapeHtml(x.objective)} | المالك: ${escapeHtml(x.owner)} | الموازنة: ${escapeHtml(x.budget)}</small></div>`).join("")||'<div class="empty" style="grid-column:1/-1">لم تضف مبادرات بعد</div>'}</div>
<div class="stage-actions"><button class="btn ghost" data-go="indicators">السابق</button><button class="btn primary" data-go="operations">التالي: الخطة التشغيلية</button></div>`,
operations:p=>`<div class="section-title"><div><h3>الخطة التشغيلية</h3><p>ربط الأنشطة السنوية بالمبادرات والمخرجات والمسؤوليات والزمن والميزانية.</p></div><button class="btn primary" id="addOperationBtn">إضافة نشاط</button></div>
<div class="table-wrap card"><table class="data-table"><thead><tr><th>النشاط</th><th>المبادرة</th><th>المخرج</th><th>المسؤول</th><th>البداية</th><th>النهاية</th><th>المستهدف</th><th></th></tr></thead><tbody>
${p.operations.map((x,i)=>`<tr><td>${escapeHtml(x.activity)}</td><td>${escapeHtml(x.initiative)}</td><td>${escapeHtml(x.output)}</td><td>${escapeHtml(x.owner)}</td><td>${escapeHtml(x.start)}</td><td>${escapeHtml(x.end)}</td><td>${escapeHtml(x.target)}</td><td><button class="icon-btn delete-item" data-type="operations" data-index="${i}">×</button></td></tr>`).join("")||'<tr><td colspan="8"><div class="empty">لم تضف أنشطة تشغيلية</div></td></tr>'}
</tbody></table></div><div class="stage-actions"><button class="btn ghost" data-go="initiatives">السابق</button><button class="btn primary" data-go="performance">التالي: متابعة الأداء</button></div>`,
performance:p=>`<div class="section-title"><div><h3>متابعة الأداء والانحرافات</h3><p>تحويل القياس إلى قرارات تصحيحية ومتابعة تنفيذها.</p></div><button class="btn primary" id="addPerformanceBtn">إضافة تحديث</button></div>
<div class="list-stack">${p.performanceUpdates.map((x,i)=>`<div class="list-item"><span class="badge ${x.status==="متأخر"?"danger":x.status==="بحاجة تدخل"?"warning":"success"}">${escapeHtml(x.status)}</span><div class="grow"><h4>${escapeHtml(x.indicator)}</h4><p>الفعلي: ${escapeHtml(x.actual)} — المستهدف: ${escapeHtml(x.target)}</p><small>السبب: ${escapeHtml(x.cause)} | الإجراء: ${escapeHtml(x.action)}</small></div><button class="icon-btn delete-item" data-type="performanceUpdates" data-index="${i}">×</button></div>`).join("")||'<div class="empty">أضف أول قراءة أداء وتحليل انحراف</div>'}</div>
<div class="stage-actions"><button class="btn ghost" data-go="operations">السابق</button><button class="btn primary" data-go="governance">التالي: الحوكمة</button></div>`,
governance:p=>`<div class="section-title"><div><h3>حوكمة الاستراتيجية والأداء</h3><p>تحديد الأدوار ودورية المراجعة ومسار الاعتماد والتصعيد.</p></div><span class="badge">RACI</span></div>
<div class="card"><div class="form-grid">
${Object.entries({boardRole:"دور مجلس الإدارة",executiveRole:"دور الإدارة التنفيذية",strategyOfficeRole:"دور مكتب الاستراتيجية والأداء",approvalFlow:"مسار الاعتماد والتصعيد"}).map(([k,l])=>`<div class="field"><label>${l}</label><textarea class="input" data-field="governance.${k}">${escapeHtml(p.governance[k])}</textarea></div>`).join("")}
<div class="field"><label>دورية مراجعة الأداء</label><select class="input" data-field="governance.reviewCycle">${["شهري","ربع سنوي","نصف سنوي","سنوي"].map(x=>`<option ${p.governance.reviewCycle===x?"selected":""}>${x}</option>`).join("")}</select></div>
</div></div><div class="stage-actions"><button class="btn ghost" data-go="performance">السابق</button><button class="btn primary" data-go="report">التالي: التقرير</button></div>`,
report:p=>buildReport(p)
};

function buildReport(p){
  return `<div class="section-title no-print"><div><h3>التقرير الاستراتيجي المتكامل</h3><p>ملخص مترابط لجميع مكونات الخطة.</p></div><button class="btn primary" onclick="window.print()">طباعة / حفظ PDF</button></div>
  <section class="hero report-section"><div><span class="eyebrow" style="color:#d7c08c">الخطة الاستراتيجية</span><h3>${escapeHtml(p.organization.name||p.name)}</h3><p>${escapeHtml(p.organization.startYear)}–${escapeHtml(p.organization.endYear)} | ${escapeHtml(p.organization.sector)}</p></div><div class="hero-stat"><div class="stat-box"><small>الأهداف</small><strong>${p.objectives.length}</strong></div><div class="stat-box"><small>المؤشرات</small><strong>${p.indicators.length}</strong></div></div></section>
  ${[
    ["الغاية",p.identity.purpose],["الرؤية",p.identity.vision],["الرسالة",p.identity.mission]
  ].map(([t,v])=>`<div class="card report-section"><h3>${t}</h3><p>${escapeHtml(v)||"—"}</p></div>`).join("")}
  <div class="card report-section"><h3>القيم</h3><div class="grid three">${p.identity.values.map(v=>`<div><strong>${escapeHtml(v.name)}</strong><p>${escapeHtml(v.definition)}</p></div>`).join("")||"—"}</div></div>
  <div class="card report-section"><h3>القضايا الاستراتيجية</h3><ol>${p.issues.map(x=>`<li><strong>${escapeHtml(x.title)}</strong> — ${escapeHtml(x.description)}</li>`).join("")||"<li>—</li>"}</ol></div>
  <div class="card report-section"><h3>الأبعاد والأهداف</h3>${p.dimensions.map(d=>`<h4>${escapeHtml(d.name)}</h4><ul>${p.objectives.filter(o=>o.dimension===d.name).map(o=>`<li>${escapeHtml(o.title)}</li>`).join("")||"<li>لا توجد أهداف مرتبطة</li>"}</ul>`).join("")||"—"}</div>
  <div class="card report-section"><h3>المؤشرات الاستراتيجية</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>المؤشر</th><th>الهدف</th><th>الخط الأساسي</th><th>المستهدف</th></tr></thead><tbody>${p.indicators.map(x=>`<tr><td>${escapeHtml(x.name)}</td><td>${escapeHtml(x.objective)}</td><td>${escapeHtml(x.baseline)}</td><td>${escapeHtml(x.target)}</td></tr>`).join("")||"<tr><td colspan='4'>—</td></tr>"}</tbody></table></div></div>
  <div class="card report-section"><h3>المبادرات</h3><ol>${p.initiatives.map(x=>`<li><strong>${escapeHtml(x.name)}</strong> — ${escapeHtml(x.description)}</li>`).join("")||"<li>—</li>"}</ol></div>`;
}

function bindDynamic(){
  bindArrayEditors();
  document.querySelectorAll(".diag-range").forEach(el=>el.oninput=()=>{getPlan().diagnosis[el.dataset.axis].score=Number(el.value);saveState();render();});
  document.querySelectorAll(".diag-field").forEach(el=>el.oninput=()=>{getPlan().diagnosis[el.dataset.axis][el.dataset.prop]=el.value;saveState();});
  document.querySelectorAll(".delete-item").forEach(b=>b.onclick=()=>{
    const p=getPlan(),type=b.dataset.type,i=Number(b.dataset.index);
    if(type==="values")p.identity.values.splice(i,1);else p[type].splice(i,1);saveState();render();
  });
  document.querySelectorAll(".suggest-identity").forEach(b=>b.onclick=()=>{
    const kind=b.dataset.kind,opts=suggestIdentity(kind,getPlan());
    openModal("مقترحات صياغة",`<div class="list-stack">${opts.map((o,i)=>`<label class="list-item"><input type="radio" name="sugg" value="${i}" ${i===0?"checked":""}><div class="grow">${escapeHtml(o)}</div></label>`).join("")}</div>`,()=>{
      const i=Number(document.querySelector('input[name="sugg"]:checked')?.value||0);getPlan().identity[kind]=opts[i];saveState();render();
    });
  });
  const addHandlers={
    addStakeholderBtn:()=>openModal("إضافة صاحب مصلحة",formHtml([
      ["name","اسم الطرف","text"],["influence","درجة التأثير 1–5","number"],["interest","درجة الاهتمام 1–5","number"],["need","الاحتياج أو التوقع","text"],["strategy","استراتيجية التعامل","text"]
    ]),()=>pushFromForm("stakeholders",["name","influence","interest","need","strategy"])),
    addValueBtn:()=>openModal("إضافة قيمة",formHtml([["name","اسم القيمة","text"],["definition","تعريف القيمة","text"],["behaviors","السلوكيات الدالة عليها","text"]]),()=>{const o=readForm(["name","definition","behaviors"]);getPlan().identity.values.push(o);saveState();render();}),
    addIssueBtn:()=>openModal("إضافة قضية استراتيجية",formHtml([["title","عنوان القضية","text"],["description","وصف القضية","text"],["impact","الأثر 1–5","number"],["urgency","الاستعجال 1–5","number"],["capability","قدرة المنظمة 1–5","number"]]),()=>{let o=readForm(["title","description","impact","urgency","capability"]);o.priority=Math.round((Number(o.impact)+Number(o.urgency)+Number(o.capability))/15*100);getPlan().issues.push(o);saveState();render();}),
    addDimensionBtn:()=>openModal("إضافة بُعد",formHtml([["name","اسم البعد","text"],["description","وصف البعد","text"]]),()=>pushFromForm("dimensions",["name","description"])),
    addObjectiveBtn:()=>openModal("إضافة هدف استراتيجي",formHtml([["title","صياغة الهدف","text"],["description","الوصف والمبرر","text"],["dimension","البعد","text"],["issue","القضية المرتبطة","text"],["owner","مالك الهدف","text"],["baseline","خط الأساس","text"],["target","المستهدف النهائي","text"]]),()=>pushFromForm("objectives",["title","description","dimension","issue","owner","baseline","target"])),
    addMapLinkBtn:()=>openModal("إضافة علاقة سببية",formHtml([["from","الهدف المؤثر","text"],["to","الهدف المتأثر","text"],["rationale","مبرر العلاقة","text"]]),()=>pushFromForm("mapLinks",["from","to","rationale"])),
    addIndicatorBtn:()=>openModal("إضافة مؤشر",formHtml([["name","اسم المؤشر","text"],["objective","الهدف المرتبط","text"],["type","النوع: قائد/متأخر/KPI","text"],["formula","معادلة القياس","text"],["baseline","خط الأساس","text"],["target","المستهدف","text"],["frequency","دورية القياس","text"],["source","مصدر البيانات","text"],["owner","مالك المؤشر","text"]]),()=>pushFromForm("indicators",["name","objective","type","formula","baseline","target","frequency","source","owner"])),
    addInitiativeBtn:()=>openModal("إضافة مبادرة",formHtml([["name","اسم المبادرة","text"],["description","الوصف","text"],["objective","الهدف المرتبط","text"],["owner","المالك","text"],["budget","الموازنة","text"],["status","الحالة","text"]]),()=>pushFromForm("initiatives",["name","description","objective","owner","budget","status"])),
    addOperationBtn:()=>openModal("إضافة نشاط تشغيلي",formHtml([["activity","النشاط","text"],["initiative","المبادرة","text"],["output","المخرج","text"],["owner","المسؤول","text"],["start","تاريخ البداية","date"],["end","تاريخ النهاية","date"],["target","المستهدف","text"]]),()=>pushFromForm("operations",["activity","initiative","output","owner","start","end","target"])),
    addPerformanceBtn:()=>openModal("تحديث أداء",formHtml([["indicator","المؤشر","text"],["actual","القيمة الفعلية","text"],["target","المستهدف","text"],["status","الحالة","text"],["cause","سبب الانحراف","text"],["action","الإجراء التصحيحي","text"]]),()=>pushFromForm("performanceUpdates",["indicator","actual","target","status","cause","action"]))
  };
  Object.entries(addHandlers).forEach(([id,fn])=>{const el=document.getElementById(id);if(el)el.onclick=fn;});
  document.querySelectorAll(".review-objective").forEach(b=>b.onclick=()=>{
    const o=getPlan().objectives[Number(b.dataset.index)],sc=scoreText(o.title,"objective");
    openModal("تحكيم الهدف",`<div class="score-wrap"><div class="score-ring" style="--score:${sc.score}%"><strong>${sc.score}%</strong></div><div class="rubric-list">${sc.details.map(r=>`<div class="rubric-item"><span>${r.name}</span><div class="rubric-bar"><span style="width:${r.score/r.max*100}%"></span></div><b>${r.score}</b></div>`).join("")}</div></div><div class="callout ${sc.score>=80?"success":"warning"}" style="margin-top:16px">${sc.score>=80?"الصياغة جيدة مبدئيًا. استكمل الربط بالمؤشرات والمستهدفات.":"الصياغة تحتاج مزيدًا من التركيز على النتيجة والقياس والزمن."}</div>`);
  });
}

function formHtml(fields){return `<div class="form-grid">${fields.map(([id,label,type])=>`<div class="field ${id==="description"?"full":""}"><label>${label}</label><input id="f_${id}" class="input" type="${type||"text"}"></div>`).join("")}</div>`;}
function readForm(keys){return Object.fromEntries(keys.map(k=>[k,document.getElementById("f_"+k)?.value||""]));}
function pushFromForm(type,keys){getPlan()[type].push(readForm(keys));saveState();render();}

const originalRender=render;
render=function(){originalRender();bindDynamic();};

document.getElementById("planSelect").onchange=e=>{currentPlanId=e.target.value;currentStage="dashboard";render();};
document.getElementById("newPlanBtn").onclick=()=>{
  openModal("إنشاء خطة جديدة",`<div class="field"><label>اسم الخطة</label><input id="newPlanName" class="input" value="الخطة الاستراتيجية الجديدة"></div>`,()=>{
    const p=newPlan(document.getElementById("newPlanName").value||"خطة جديدة");state.plans.push(p);currentPlanId=p.id;saveState();render();
  });
};
document.getElementById("duplicatePlanBtn").onclick=()=>{
  const src=getPlan(), copy=JSON.parse(JSON.stringify(src));copy.id=uid();copy.name=src.name+" - نسخة";state.plans.push(copy);currentPlanId=copy.id;saveState();render();showToast("تم إنشاء نسخة من الخطة");
};
document.getElementById("menuBtn").onclick=()=>document.getElementById("sidebar").classList.toggle("open");
document.getElementById("printBtn").onclick=()=>{currentStage="report";render();setTimeout(()=>window.print(),200);};
document.getElementById("generateReportBtn").onclick=()=>{currentStage="report";render();};
document.getElementById("exportJsonBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="masar-strategy-backup.json";a.click();URL.revokeObjectURL(a.href);
};
document.getElementById("importJsonInput").onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!s.plans?.length)throw Error();state=s;currentPlanId=s.currentPlanId||s.plans[0].id;saveState();render();showToast("تم استيراد النسخة بنجاح");}catch(_){showToast("الملف غير صالح");}};r.readAsText(f);
};
document.getElementById("reviewPlanBtn").onclick=()=>{
  const p=getPlan(),issues=[];
  if(!p.identity.vision)issues.push("الرؤية غير مكتملة");
  if(!p.identity.mission)issues.push("الرسالة غير مكتملة");
  if(p.objectives.length<3)issues.push("عدد الأهداف الاستراتيجية قليل");
  if(p.indicators.length<p.objectives.length)issues.push("بعض الأهداف لا يقابلها مؤشر");
  p.objectives.forEach(o=>{if(!p.indicators.some(i=>i.objective===o.title))issues.push(`الهدف «${o.title}» بلا مؤشر مطابق`);});
  p.initiatives.forEach(i=>{if(!p.objectives.some(o=>o.title===i.objective))issues.push(`المبادرة «${i.name}» غير مرتبطة بهدف مطابق`);});
  openModal("نتيجة فحص الاتساق",issues.length?`<div class="list-stack">${issues.map(x=>`<div class="list-item"><span class="badge warning">تنبيه</span><div>${escapeHtml(x)}</div></div>`).join("")}</div>`:`<div class="callout success">لم تُكتشف تعارضات أساسية. استمر في المراجعة البشرية والاعتماد المؤسسي.</div>`);
};

render();

</script>
</body>
</html>
